<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Glamour</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: white;
            font-family: "Nunito", serif;
            cursor: default;
            transition: 0.2s;
        }
        a {
            font-size: 20px;
            color: black;
            transition: 0.2s;
            padding: 6px;
            text-decoration: none;
        }
        a:hover {
            color: #fa147f;
            cursor:default;
        }
        h1 {
            color: black;
            padding-left: 30px;
            padding-top: 20px;
        }

        input {
            border: #937d88 1px solid;
            border-radius: 5px;
            height: 30px;
            font-size: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            width: 100%;
            background-color: white;
            position: fixed;
            z-index: 1;
        }

        footer {
            display: flex;
            justify-content: space-between;
        }

        .logo {
            height: 50px;
        }

        .fa-cart-shopping {
            color: #b8b8b8;
            font-size: 32px;
        }

        .pinkcolor {
            color: #e32ea0;
        }

        .sign {
            height: 35px;
        }

        .big_box {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .max_box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            margin-left: 6%;
        }

        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 330px;
            height: 550px;
            border: #c2c2c2 3px solid;
            border-radius: 16px;
            margin: 25px;
            position: relative;
            overflow: hidden;
        }

        .upperbox {
            background-color: #e0e0e0;
            border-radius: 16px 0 0 16px;
            width: 100%;
            height: 75%;
        }

        .lowerbox {
            background-color: #f3f3f3;
            border-radius: 0 0 16px 16px;
            width: 100%;
            height: 25%;
            font-size: 22px;
            position: relative;
        }

        h4,
        h3 {
            position: absolute;
        }

        .lowerbox h3 {
            left: 20px;
            top: 40px;
        }

        .lowerbox h4 {
            left: 20px;
            top: -5px;
        }

        #mainshopping {
            position: relative;
        }

        .shopping {
            position: absolute;
            top: 45px;
            right: 30px;
            transition: 0.2s;
        }

        .shoppingactive {
            transform: translateY(5px) scale(1.2);
        }

        .shoppingcount {
            font-size: 15px;
            top: 10px;
            right: -13px;
            position: absolute;
            color: black;
        }

        .products {
            width: 100%;
        }

        .like {
            position: absolute;
            background-image: url('empty_like.svg');
            height: 27px;
            width: 32px;
            top: 25px;
            right: 25px;
            transition: 0.2s;
        }

        .like:hover,
        .fulllike:hover {
            transform: scale(1.2)
        }

        .fulllike {
            background-image: url('full_like.svg');
            height: 24px;
            width: 27px;
            top: 29px;
            right: 29px;
        }

        .mainlike {
            position: relative;
            background-image: url('empty_like.svg');
            height: 27px;
            width: 32px;
            transition: 0.2s;
        }

        .mainfulllike {
            background-image: url('full_like.svg');
            height: 24px;
            width: 27px;
        }

        .likecount {
            font-size: 17px;
            top: 1px;
            right: -5px;
            position: absolute;
            color: black;
        }

        .bar {
            display: flex;
            justify-content: center;
            color: black;
            font-size: 20px;
        }


        article,
        #messege {
            position: fixed;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background-color: #e32ea0;
            font-size: 30px;
            bottom: 100px;
            right: 100px;
            border-radius: 100%;
            opacity: 0;
            transition: opacity 1s;
            cursor: default;
        }

        #messege {
            left: 100px
        }

        .vis {
            opacity: 1;
        }

        #scrollprogress {
            height: 10px;
            width: 0%;
            top: 0;
            background-color: #fb448f;
            transition: 0.1s;
            z-index: 100;
        }

        #scroll {
            position: relative;
            left: 0;
            background-color: #bebebe;
            height: 10px;
            width: 100%;
            position: fixed;
            top: 0;
        }

        #okno {
            width: 700px;
            height: 450px;
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            margin: auto;
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 50px;
            position: fixed;
            opacity: 0;
            z-index: -1;
        }

        .opacityokno {
            opacity: 1;
            z-index: 1;
        }

        #zatemnenie:target {
            display: block;
        }

        .close {
            border: 1px solid #0000cc;
            color: #0000cc;
            padding: 0 12px;
            margin: 10px;
            background: #f2f2f2;
        }

        .close:hover {
            background: #e6e6ff;
        }

        .lowdiv {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #order,
        #bascket {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 250px;
            height: 30px;
            border-radius: 15px;
            padding: 10px;
            color: white;
            font-size: 20px;
            margin: 10px;
        }

        #order {
            background-color: #c52996;
        }

        #bascket {
            background-color: black;
        }
    </style>
</head>



<body>
    <div id="scroll">
        <div id="scrollprogress"></div>
    </div>
    <header>
        <img class="logo" src="logo1.png">
        <div class="bar">
            <div class="choose">
                <a href="">Новинки</a>
            </div>
            <div class="choose">
                <a href="#clothes">Одежда</a>
            </div>
            <div class="choose">
                <a href="#accsesoires">Аксессуары</a>
            </div>
            <div class="choose">
                <a href="">Косметика</a>
            </div>
            <div class="choose">
                <a href="">Хиты продаж</a>
            </div>
            <div class="choose">
                <a href="">Sale</a>
            </div>
        </div>
        <input type="text">
        <div id="mainlike" class="mainlike">
            <p id="likecount" class="likecount"></p>
        </div>
        <i id='mainshopping' class="fa-solid fa-cart-shopping">
            <p id="shoppingcount" class="shoppingcount"></p>
        </i>
        <img class="sign" src="sign.jpg">
    </header>

    <div class="max_box">
        <h1 id="clothes">Одежда</h1>
        <div class="big_box">
            <div class="box">
                <div class="upperbox">
                    <div class="like"></div>
                    <img class='products' src="photo1.jpg">
                </div>
                <div class="lowerbox">
                    <h4>Боди Boo</h4>
                    <h3>5180 ₽</h3>
                    <i class="fa-solid fa-cart-shopping shopping"></i>
                </div>
            </div>
            <div class="box">
                <div class="upperbox">
                    <div class="like"></div>
                    <img class='products' src="photo2.jpg">
                </div>
                <div class="lowerbox">
                    <h4>Болеро Grace</h4>
                    <h3>6280 ₽</h3>
                    <i class="fa-solid fa-cart-shopping shopping"></i>
                </div>
            </div>
            <div class="box">
                <div class="upperbox">
                    <div class="like"></div>
                    <img class='products' src="photo4.jpg">
                </div>
                <div class="lowerbox">
                    <h4>Платье Monom black</h4>
                    <h3>7980 ₽</h3>
                    <i class="fa-solid fa-cart-shopping shopping"></i>
                </div>
            </div>
        </div>
        <h1 id="accsesoires" > Аксессуары </h1>
        <div class="big_box">
            <div class="box">
                <div class="upperbox">
                    <div class="like"></div>
                    <img class='products' src="photo3.jpg">
                </div>
                <div class="lowerbox">
                    <h4>Накидка Lotus Clean</h4>
                    <h3>9990 ₽</h3>
                    <i class="fa-solid fa-cart-shopping shopping"></i>
                </div>
            </div>
            <div class="box">
                <div class="upperbox">
                    <div class="like"></div>
                    <img class='products' src="photo5.jpg">
                </div>
                <div class="lowerbox">
                    <h4>Шарф We trust</h4>
                    <h3>9990 ₽</h3>
                    <i class="fa-solid fa-cart-shopping shopping"></i>
                </div>
            </div>
            <div class="box">
                <div class="upperbox">
                    <div class="like"></div>
                    <img class='products' src="photo6.jpg">
                </div>
                <div class="lowerbox">
                    <h4>Шарф Lotus</h4>
                    <h3>7990 ₽</h3>
                    <i class="fa-solid fa-cart-shopping shopping"></i>
                </div>
            </div>
        </div>

        <div id="zatemnenie">
            <div id="okno">
                <h1>Товар добавлен в корзину!</h1>
                <h1 id="h1"></h1>
                <div class="lowdiv">
                    <div id="bascket">В корзину</div>
                    <div id="order">Оформить заказ</div>
                </div>
            </div>
        </div>
    </div>
        <footer>
            <div id="messege"><i class="fa-brands fa-signal-messenger"></i></div>
            <article id="up">Up</article>
        </footer>
        <script>
            'usestrict'
            //полоса прокрутки//
            let btnTop = document.querySelector('article')
            window.addEventListener('scroll', function () {
                if (window.pageYOffset >= document.body.clientHeight / 4) {
                    btnTop.style.opacity = 1
                }
                else {
                    btnTop.style.opacity = 0
                }
                let w = window.pageYOffset / (document.body.scrollHeight - window.innerHeight) * 100;
                document.body.querySelector('#scrollprogress').style.width = w + '%';
                console.log(w);
            })
            //кнопка наверх//
            btnTop.addEventListener('click', function () {
                let totop = setInterval(ScrollUp, 10)
                function ScrollUp() {
                    window.scrollBy(0, -20);
                    if (window.pageYOffset == 0) {
                        clearInterval(totop)
                    }
                }
            })
            //лайк по нажатию//
            let countLikes = 0
            let likeElements = document.getElementsByClassName('like')
            let mainlike = document.getElementById('mainlike')
            for (let i = 0; i < likeElements.length; i++)
                likeElements[i].addEventListener('click', function () {
                    likeElements[i].classList.toggle('fulllike');
                    // Увеличиваем или уменьшаем количество лайков в зависимости от состояния
                    if (likeElements[i].classList.contains('fulllike')) {
                        countLikes++;
                    } else {
                        countLikes--;
                    }
                    // Обновляем отображение количества лайков
                    likecount.textContent = countLikes;
                    if (countLikes > 0) {
                        mainlike.classList.add('mainfulllike');
                    } else {
                        mainlike.classList.remove('mainfulllike');
                    }
                })
            let countShopping = 0
            let shoppingElements = document.getElementsByClassName('shopping')
            let mainshopping = document.getElementById('mainshopping')
            for (let i = 0; i < shoppingElements.length; i++) {
                shoppingElements[i].addEventListener('click', function () {
                    shoppingElements[i].classList.toggle('pinkcolor');
                    shoppingElements[i].classList.toggle('shoppingactive')
                    // Увеличиваем или уменьшаем количество шоппинга в зависимости от состояния
                    if (shoppingElements[i].classList.contains('pinkcolor')) {
                        countShopping++;
                    } else {
                        countShopping--;
                    }
                    // Обновляем отображение количества шоппинга
                    shoppingcount.textContent = countShopping;
                    if (countShopping > 0) {
                        mainshopping.classList.add('pinkcolor');
                    } else {
                        mainshopping.classList.remove('pinkcolor');
                    }
                })
            }
            //появление значка смс таймер//
            let mes = document.getElementById('messege')
            function sms() {
                mes.style.opacity = 1
            }
            setTimeout(sms, 5000);
            //всплывающее окно по нажатию на смс//
            let okno = document.getElementById('okno');
            mes.addEventListener('click', function () {
                okno.classList.add('opacityokno');
                console.log('icahaci')
            })
        </script>
</body>

</html>
