<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Название документа</title>
    <style>
      #zatemnenie {
        background: rgba(102, 102, 102, 0.5);
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: none;
      }
      #okno {
        width: 700px;
        height: 450px;
        text-align: center;
        padding: 15px;
        border-radius: 15px;
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        margin: auto;
        background: #fff;
        display: flex;
        flex-direction: column;
        padding: 50px;
      }
      #zatemnenie:target {display: block;}
      .close {
        border: 1px solid #0000cc;
        color: #0000cc;
        padding: 0 12px;
        margin: 10px;
        background: #f2f2f2;
      }
      .close:hover {background: #e6e6ff;}

      .lowdiv {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #order, #bascket {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 250px;
        height: 30px;
        border-radius: 15px;
        padding: 10px;
        color: white;
        font-size: 20px;
        margin: 10px;
      }
      #order {
        background-color: #c52996;
      }
      #bascket {
        background-color: black;
      }
    </style>
  </head>
 
  <body>
   
    <div id="zatemnenie">
      <div id="okno">
        <h1>Товар добавлен в корзину!</h1>
        <h1 id="h1"></h1>
        <div class="lowdiv">
            <div id="bascket">В корзину</div>
            <div id="order">Оформить заказ</div>
        </div>
      </div>
    </div>
     
    <a href="#zatemnenie">Вызвать всплывающее окно</a>
 
  </body>
</html>
